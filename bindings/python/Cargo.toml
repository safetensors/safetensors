[package]
name = "safetensors-python"
version = "0.9.0-dev.0"
edition = "2021"
rust-version = "1.74"

[lib]
name = "safetensors_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3", "abi3-py310"] }
memmap2 = "0.9"
serde_json = "1.0"

[dependencies.safetensors]
path = "../../safetensors"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
  "MTLDevice",
  "MTLBuffer",
  "MTLResource",
] }
